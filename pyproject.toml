[project]
name = "inferscope"
version = "0.1.0"
description = "OpenTelemetry for LLM inference internals: queueing, batching, and KV-cache observability."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-grpc>=1.25"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]
lab = ["torch>=2.2", "transformers>=4.40"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inferscope", "src/inferscope_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    # Starlette's TestClient and anyio emit these against each other; nothing
    # here can act on them, and they drown the signal we do care about.
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:anyio.*",
    "ignore:Using `httpx` with `starlette.testclient`:",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["inferscope", "inferscope_lab"]
mypy_path = "src"
strict = true

# The lab talks to torch and transformers, whose stubs are partial enough that
# strict mode there would be noise rather than signal. The library itself
# (inferscope) has no third-party imports and stays fully strict.
[[tool.mypy.overrides]]
module = ["inferscope_lab.hf_runner"]
disallow_any_expr = false
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["transformers.*", "torch.*"]
ignore_missing_imports = true
